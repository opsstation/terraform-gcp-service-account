#  description of this project
description: |-
  Terraform module service-account to create new modules using this as baseline

# How to use this project
usage: |-
  Here are some examples of how you can use this module in your inventory structure:

  ### service-account example
  ```hcl
      module "service-account" {
      source                                    = "opsstation/service-account/gcp"
      version                                   = "1.0.1"
      name                                      = "service-account"
      environment                               = "OpsStation"
      network                                   = module.vpc.vpc_id
      ingress_rules = [
        {
          name          = "allow-tcp-http-ingress"
          description   = "Allow TCP, HTTP ingress traffic"
          disabled      = false
          direction     = "INGRESS"
          priority      = 1000
          source_ranges = ["0.0.0.0/0"]
          allow = [
            {
              protocol = "tcp"
              ports    = ["22", "80"]
            }
          ]
        }
      ]
  }
  ```